<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:;" />
  <title>Notip — El Cerebro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brain.css" />
</head>
<body>
  <!-- Titlebar -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <div class="app-icon">
        <img src="../assets/icon.png" alt="Notip" width="20" height="20" style="object-fit: contain; vertical-align: middle;" />
      </div>
      <span class="app-name">El Cerebro</span>
    </div>
    <div class="titlebar-center">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="Buscar notas e ideas..." autocomplete="off" spellcheck="false" />
        <button id="search-clear" class="search-clear hidden" title="Limpiar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="titlebar-right">
      <button id="btn-new-note-brain" class="btn-header btn-accent-primary" title="Crear nueva nota directamente en El Cerebro">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Nueva Nota</span>
      </button>
      <button id="btn-toggle-sidebar" class="btn-header" title="Alternar panel lateral de notas y clústeres">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        <span>Explorador</span>
      </button>
      <button id="btn-open-board" class="btn-header" title="Abrir Tablero de Notas y Tareas (Kanban)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
        <span>Tablero</span>
      </button>
      <button id="btn-open-canvas" class="btn-header" title="Abrir Pizarra de notas — Canvas (Ctrl+Shift+P)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        <span>Pizarra</span>
      </button>
      <button id="btn-close" class="btn-header btn-close-win" title="Cerrar">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-chips">
      <button class="chip chip-active" data-filter="todas">Todas</button>
      <button class="chip chip-idea" data-filter="idea">Ideas</button>
      <button class="chip chip-nota" data-filter="nota">Notas</button>
      <button class="chip chip-tarea" data-filter="tarea">Tareas</button>
    </div>

    <!-- 2D / 3D Mode switch -->
    <div class="mode-switch">
      <button id="btn-mode-2d" class="mode-btn mode-active" title="Vista plana 2D">2D</button>
      <button id="btn-mode-3d" class="mode-btn" title="Vista espacial 3D">3D</button>
    </div>

    <div class="stats-row">
      <span id="stat-nodes" class="stat">0 nodos</span>
      <span class="stat-dot">&middot;</span>
      <span id="stat-edges" class="stat">0 conexiones</span>
    </div>
  </div>

  <!-- Main container: graph + sidebar panel -->
  <div class="brain-container">
    <!-- Dedicated Dynamic Neural Cortex & Synapse Canvas -->
    <canvas id="cosmos-canvas"></canvas>

    <!-- Graph canvas 2D -->
    <div id="graph-canvas"></div>

    <!-- Graph canvas 3D -->
    <div id="graph-3d" class="hidden"></div>

    <!-- Sidebar Panel (Explorer + Detail) -->
    <aside id="sidebar-panel" class="sidebar-panel">
      <!-- Sidebar Tabs Header -->
      <div class="sidebar-header">
        <div class="sidebar-tabs">
          <button id="sidebar-tab-notes" class="sidebar-tab active" title="Ver todas las notas">
            <span>Notas</span>
            <span id="badge-sidebar-notes" class="sidebar-badge">0</span>
          </button>
          <button id="sidebar-tab-clusters" class="sidebar-tab" title="Ver clústeres temáticos">
            <span>Clústeres</span>
            <span id="badge-sidebar-clusters" class="sidebar-badge">0</span>
          </button>
          <button id="sidebar-tab-detail" class="sidebar-tab hidden" title="Detalle de la nota seleccionada">
            <span>Detalle</span>
          </button>
        </div>
        <button id="sidebar-close-btn" class="sidebar-icon-btn" title="Ocultar panel lateral">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Tab View 1: Notes Explorer -->
      <div id="view-sidebar-notes" class="sidebar-content-view active">
        <div class="sidebar-search-box">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="sidebar-search-input" type="text" placeholder="Filtrar notas de la lista..." autocomplete="off" />
        </div>
        <div id="sidebar-notes-list" class="sidebar-cards-list">
          <!-- Dynamic note cards -->
        </div>
      </div>

      <!-- Tab View 2: Clusters Explorer -->
      <div id="view-sidebar-clusters" class="sidebar-content-view hidden">
        <div class="clusters-header-info">
          <p class="clusters-desc">Grupos y afinidades temáticas en tus notas:</p>
        </div>
        <div id="sidebar-clusters-list" class="sidebar-cards-list">
          <!-- Dynamic cluster cards -->
        </div>
      </div>

      <!-- Tab View 3: Note Detail -->
      <div id="view-sidebar-detail" class="sidebar-content-view hidden">
        <div class="detail-back-bar">
          <button id="btn-back-to-list" class="btn-text-action">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Volver a la lista
          </button>
          <button id="btn-focus-current-note" class="btn-text-action" title="Aislar esta nota y sus conexiones directas">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
            Enfocar
          </button>
        </div>
        <div class="preview-header">
          <div class="preview-type-badge" id="preview-badge"></div>
          <h3 id="preview-title">Selecciona un nodo</h3>
        </div>
        <div class="preview-meta">
          <span id="preview-date" class="preview-meta-item"></span>
          <span id="preview-tags" class="preview-meta-item"></span>
        </div>
        <div class="preview-content" id="preview-content">
          <p class="preview-placeholder">Haz clic en un nodo para ver su contenido.</p>
        </div>
        <div class="preview-connections" id="preview-connections">
          <h4>Conexiones</h4>
          <ul id="connections-list"></ul>
        </div>
        <div class="preview-actions">
          <button id="btn-edit-note" class="btn-action" title="Editar nota">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Editar
          </button>
          <button id="btn-delete-note" class="btn-action btn-danger" title="Eliminar nota">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
            Eliminar
          </button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Toolbar floating (bottom-left) -->
  <div class="toolbar" id="toolbar">
    <button id="btn-zoom-in" class="tool-btn" title="Acercar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <button id="btn-zoom-out" class="tool-btn" title="Alejar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <button id="btn-fit" class="tool-btn" title="Centrar vista">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/>
      </svg>
    </button>
    <div class="tool-divider"></div>
    <button id="btn-physics" class="tool-btn tool-active" title="Física activada">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/>
      </svg>
    </button>
    <button id="btn-focus-mode" class="tool-btn" title="Modo Enfoque (Aislar nodo activo y sus conexiones)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <button id="btn-auto-connect" class="tool-btn" title="Auto-conectar notas con IA">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/>
      </svg>
    </button>
    <button id="btn-connect" class="tool-btn hidden" title="Conectar nodos seleccionados">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="5" cy="12" r="3"/><circle cx="19" cy="12" r="3"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
    </button>
  </div>

  <!-- Connection mode banner -->
  <div id="connect-banner" class="connect-banner hidden">
    <span>Selecciona 2 nodos para conectarlos</span>
    <button id="connect-cancel" class="btn-connect-cancel">Cancelar</button>
    <button id="connect-confirm" class="btn-connect-confirm" disabled>Conectar</button>
  </div>

  <!-- Edit modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-edit">
      <div class="modal-header">
        <h3 id="modal-title">Editar nota</h3>
        <button id="modal-close" class="modal-close-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-filename" value="" />
        <div class="field-group">
          <label for="field-titulo">Titulo</label>
          <input id="field-titulo" type="text" placeholder="Titulo de la nota..." autocomplete="off" />
        </div>
        <div class="field-group">
          <label for="field-contenido">Contenido</label>
          <textarea id="field-contenido" rows="6" placeholder="Escribe el contenido..."></textarea>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label for="field-tipo">Tipo</label>
            <select id="field-tipo">
              <option value="idea">Idea</option>
              <option value="nota">Nota</option>
              <option value="tarea">Tarea</option>
            </select>
          </div>
          <div class="field-group">
            <label for="field-tags">Tags (separados por coma)</label>
            <input id="field-tags" type="text" placeholder="ej: programacion, universidad" autocomplete="off" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn-secondary">Cancelar</button>
        <button id="modal-save" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          Guardar
        </button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="../../node_modules/vis-network/standalone/umd/vis-network.min.js"></script>
  <script src="../../node_modules/3d-force-graph/dist/3d-force-graph.min.js"></script>
  <script src="../utils/fuzzySearch.js"></script>
  <script src="brain.js"></script>
</body>
</html>
