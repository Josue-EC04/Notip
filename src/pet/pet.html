<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:;" />
  <title>Notip Pet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="pet-container">
    <!-- Cosmic aura glow ring behind pet -->
    <div id="glow-ring"></div>

    <!-- Cosmic speech bubble (floats above the pet) -->
    <div id="speech-bubble" class="hidden">
      <span id="speech-indicator"></span>
      <span id="speech-text">¡Hola!</span>
    </div>

    <!-- The robot image / CSS-pet -->
    <div id="pet-sprite">
      <div id="pet-img"></div>
      <!-- Click ripple overlay -->
      <div id="click-ripple"></div>
    </div>
  </div>

  <script src="pet.js"></script>
</body>
</html>
