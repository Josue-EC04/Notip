<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notip — Pizarra de Notas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="canvas.css" />
</head>
<body>
  <!-- Titlebar -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <div class="app-icon">
        <img src="../assets/icon.png" alt="Notip" width="20" height="20" style="object-fit: contain; vertical-align: middle;" />
      </div>
      <span class="app-name">Notip — Pizarra</span>
      <span class="canvas-tag">CANVAS</span>
    </div>

    <div class="titlebar-center">
      <!-- Search input -->
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="Buscar en la pizarra..." autocomplete="off" spellcheck="false" />
        <button id="search-clear" class="search-clear hidden" title="Limpiar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Zoom bar -->
      <div class="zoom-controls">
        <button id="btn-zoom-out" class="btn-tool" title="Reducir zoom (-)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <span id="zoom-level" class="zoom-text" title="Restablecer zoom al 100%">100%</span>
        <button id="btn-zoom-in" class="btn-tool" title="Aumentar zoom (+)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button id="btn-zoom-fit" class="btn-tool" title="Ajustar todas las notas a la pantalla">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="titlebar-right">
      <button id="btn-add-card" class="btn-header btn-primary-accent" title="Nueva nota adhesiva (o doble clic en el lienzo)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Nueva Nota</span>
      </button>

      <button id="btn-tidy" class="btn-header" title="Auto-ordenar notas en cuadrícula limpia">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Ordenar</span>
      </button>

      <div class="theme-picker-wrap">
        <button id="btn-theme" class="btn-header" title="Cambiar color de fondo de la pizarra">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 2a10 10 0 0 1 0 20z"></path>
          </svg>
          <span id="theme-label">Fondo</span>
        </button>
        <div id="theme-dropdown" class="theme-dropdown hidden">
          <div class="theme-option active" data-theme="warm">
            <span class="theme-preview" style="background:#FBF9F5; border: 1.5px solid #4F46E5;"></span>
            <span>Editorial Crema</span>
          </div>
          <div class="theme-option" data-theme="paper">
            <span class="theme-preview" style="background:#FFFFFF; border: 1px solid #D1D5DB;"></span>
            <span>Lino Blanco</span>
          </div>
          <div class="theme-option" data-theme="slate">
            <span class="theme-preview" style="background:#1E293B; border: 1px solid #64748B;"></span>
            <span>Grafito Suave</span>
          </div>
          <div class="theme-option" data-theme="chalkboard">
            <span class="theme-preview" style="background:#0B1B14; border: 1px solid #10B981;"></span>
            <span>Pizarra Verde</span>
          </div>
          <div class="theme-option" data-theme="blueprint">
            <span class="theme-preview" style="background:#0A192F; border: 1px solid #00F2FE;"></span>
            <span>Azul Blueprint</span>
          </div>
        </div>
      </div>

      <button id="btn-open-brain" class="btn-header" title="Abrir El Cerebro (Grafo 2D/3D)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"></circle>
          <circle cx="18" cy="6" r="3"></circle>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="18" r="3"></circle>
          <line x1="9" y1="6" x2="15" y2="6"></line>
          <line x1="6" y1="9" x2="6" y2="15"></line>
        </svg>
        <span>Cerebro</span>
      </button>

      <button id="btn-open-board" class="btn-header" title="Abrir Tablero Kanban de Tareas">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="6" height="16" rx="1"/>
          <rect x="14" y="4" width="6" height="10" rx="1"/>
        </svg>
        <span>Tablero</span>
      </button>

      <button id="btn-close" class="btn-header btn-close-win" title="Cerrar">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Canvas Container -->
  <main id="canvas-container" class="canvas-container">
    <!-- Grid canvas background -->
    <div id="canvas-grid" class="canvas-grid"></div>

    <!-- Transformation stage (Pan & Zoom) -->
    <div id="canvas-stage" class="canvas-stage">
      <!-- Dynamic sticky cards injected here -->
    </div>

    <!-- Floating HUD Hint -->
    <div class="canvas-hint">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 4px;"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
      <span>Arrastra el fondo para moverte · Rueda para zoom · Doble clic para crear nota</span>
    </div>

    <!-- Floating Quick Counter -->
    <div class="canvas-counter" id="canvas-counter">
      <span class="pulse-dot"></span>
      <span id="counter-text">0 notas</span>
    </div>

    <!-- Interactive Minimap (Radar) -->
    <div class="minimap-box" id="minimap-box" title="Navegador de la pizarra">
      <canvas id="minimap-canvas" width="180" height="120"></canvas>
      <div id="minimap-viewport" class="minimap-viewport"></div>
    </div>
  </main>

  <!-- Note Quick Detail / Full Editor Modal -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-editor">
      <div class="modal-header">
        <div class="modal-header-left">
          <span id="modal-type-badge" class="badge-type">Nota</span>
          <input id="modal-title-input" class="modal-title-input" type="text" placeholder="Título de la nota..." />
        </div>
        <div class="modal-header-right">
          <button id="modal-delete" class="btn-danger-ghost" title="Eliminar nota">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
          <button id="modal-close" class="modal-close-btn" title="Cerrar (Esc)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <div class="modal-meta-row">
          <span id="modal-date" class="modal-meta-text">Fecha</span>
          <div id="modal-tags" class="modal-tags-list"></div>
        </div>
        <textarea id="modal-textarea" class="modal-textarea" rows="12" placeholder="Escribe el contenido de tu nota en Markdown..."></textarea>
      </div>
      <div class="modal-footer">
        <button id="modal-cancel" class="btn-secondary">Cerrar</button>
        <button id="modal-save" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          Guardar cambios
        </button>
      </div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast" class="toast hidden"></div>

  <script src="canvas.js"></script>
</body>
</html>
