<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notip — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <!-- Fondo dinámico de nodos -->
  <canvas id="bg-canvas"></canvas>

  <!-- Barra de título arrastrable -->
  <div class="titlebar" id="titlebar">
    <div class="titlebar-logo">
      <img src="../assets/icon.png" alt="Notip" class="titlebar-icon" />
      <span>Notip</span>
    </div>
    <div class="titlebar-controls">
      <button class="btn-win btn-close" id="btn-close" title="Cerrar">✕</button>
    </div>
  </div>

  <!-- Contenedor principal -->
  <main class="login-container">

    <!-- Card de login -->
    <div class="login-card" id="login-card">

      <!-- Logo y branding -->
      <div class="brand-section">
        <div class="mascot-wrapper">
          <img src="../assets/icon.png" alt="Mascota Notip" class="mascot-img" />
          <div class="mascot-glow"></div>
        </div>
        <h1 class="brand-title">Notip</h1>
        <p class="brand-subtitle">Tu segundo cerebro, potenciado por IA</p>
      </div>

      <!-- Divider -->
      <div class="divider">
        <span>Bienvenido</span>
      </div>

      <!-- Descripción -->
      <p class="login-desc">
        Inicia sesión para sincronizar tus notas, tareas e ideas<br/>
        en todos tus dispositivos de forma segura.
      </p>

      <!-- Botón de Google -->
      <button class="btn-google" id="btn-google-login">
        <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M43.611 20.083H42V20H24V28H35.303C33.654 32.657 29.223 36 24 36C17.373 36 12 30.627 12 24C12 17.373 17.373 12 24 12C27.059 12 29.842 13.154 31.961 15.039L37.618 9.382C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24C4 35.045 12.955 44 24 44C35.045 44 44 35.045 44 24C44 22.659 43.862 21.35 43.611 20.083Z" fill="#FFC107"/>
          <path d="M6.306 14.691L12.877 19.51C14.655 15.108 18.961 12 24 12C27.059 12 29.842 13.154 31.961 15.039L37.618 9.382C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691Z" fill="#FF3D00"/>
          <path d="M24 44C29.166 44 33.86 42.023 37.409 38.808L31.219 33.57C29.211 35.091 26.715 36 24 36C18.798 36 14.381 32.683 12.717 28.054L6.195 33.079C9.505 39.556 16.227 44 24 44Z" fill="#4CAF50"/>
          <path d="M43.611 20.083H42V20H24V28H35.303C34.511 30.237 33.072 32.166 31.216 33.571L31.219 33.569L37.409 38.807C36.971 39.205 44 34 44 24C44 22.659 43.862 21.35 43.611 20.083Z" fill="#1976D2"/>
        </svg>
        <span>Continuar con Google</span>
      </button>

      <button class="btn-local" id="btn-local">Continuar en este equipo · sin internet</button>
      <!-- Estado de carga -->
      <div class="login-status" id="login-status" style="display:none;">
        <div class="spinner"></div>
        <span id="status-text">Abriendo el navegador…</span>
      </div>

      <!-- Mensaje de error -->
      <div class="error-banner" id="error-banner" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="error-text"></span>
      </div>

      <!-- Footer -->
      <p class="login-footer">
        Al continuar, aceptas que tus datos se almacenan de forma segura<br/>
        y privada bajo tu cuenta de Google.
      </p>

    </div>

  </main>

  <script src="auth.js"></script>
</body>
</html>
