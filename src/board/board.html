<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notip — Tablero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="board.css" />
</head>
<body>
  <!-- Titlebar -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <div class="app-icon">
        <img src="../assets/icon.png" alt="Notip" width="20" height="20" style="object-fit: contain; vertical-align: middle;" />
      </div>
      <span class="app-name">Notip — Tablero</span>
    </div>
    <div class="titlebar-center">
      <!-- Search bar -->
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search-input" type="text" placeholder="Buscar tareas..." autocomplete="off" spellcheck="false" />
        <button id="search-clear" class="search-clear hidden" title="Limpiar">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="titlebar-right">
      <button id="btn-study-focus" class="btn-header" title="Elige un primer paso que puedas avanzar ahora">Tengo 15 minutos</button>
      <button id="btn-add-quick" class="btn-header" title="Nueva tarea rápida (Ctrl+N)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>Nueva</span>
      </button>
      <button id="btn-open-brain" class="btn-header" title="Abrir El Cerebro — Grafo de ideas (Ctrl+Shift+B)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="3"></circle>
          <circle cx="18" cy="6" r="3"></circle>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="18" r="3"></circle>
          <line x1="9" y1="6" x2="15" y2="6"></line>
          <line x1="6" y1="9" x2="6" y2="15"></line>
          <line x1="18" y1="9" x2="18" y2="15"></line>
          <line x1="9" y1="18" x2="15" y2="18"></line>
        </svg>
        <span>El Cerebro</span>
      </button>
      <button id="btn-open-canvas" class="btn-header" title="Abrir Pizarra de notas — Canvas (Ctrl+Shift+P)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="9" y1="21" x2="9" y2="9"/>
        </svg>
        <span>Pizarra</span>
      </button>
      <button id="btn-close" class="btn-header btn-close-win" title="Cerrar">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Filter bar -->
  <div class="filter-bar">
    <div class="filter-chips">
      <button class="chip chip-active" data-filter="todas">
        <span>Todas</span>
        <span class="chip-count" id="chip-count-todas">0</span>
      </button>
      <button class="chip" data-filter="universidad">
        <span>Universidad</span>
        <span class="chip-count" id="chip-count-universidad">0</span>
      </button>
      <button class="chip" data-filter="trabajo">
        <span>Trabajo</span>
        <span class="chip-count" id="chip-count-trabajo">0</span>
      </button>
      <button class="chip" data-filter="personal">
        <span>Personal</span>
        <span class="chip-count" id="chip-count-personal">0</span>
      </button>
      <button class="chip" data-filter="otro">
        <span>Otro</span>
        <span class="chip-count" id="chip-count-otro">0</span>
      </button>
    </div>

    <!-- Progress Telemetry -->
    <div class="telemetry-box" title="Progreso de tareas completadas">
      <div class="telemetry-info">
        <span id="telemetry-percent" class="telemetry-percent">0%</span>
        <span class="telemetry-label" id="telemetry-status">0 de 0 listas</span>
      </div>
      <div class="telemetry-track">
        <div class="telemetry-fill" id="telemetry-bar"></div>
      </div>
    </div>

    <div class="sort-selector-wrap" title="Criterio de ordenación de tareas">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="21" y1="10" x2="3" y2="10"></line>
        <line x1="21" y1="6" x2="3" y2="6"></line>
        <line x1="21" y1="14" x2="3" y2="14"></line>
        <line x1="21" y1="18" x2="7" y2="18"></line>
      </svg>
      <select id="select-sort" class="select-sort" title="Ordenar tareas">
        <option value="prioridad">Por importancia</option>
        <option value="recientes">Más recientes</option>
        <option value="antiguos">Más antiguos</option>
        <option value="fecha_entrega">Por fecha de entrega</option>
      </select>
    </div>

    <div class="stats-row">
      <span id="stat-pending" class="stat">0 pendientes</span>
      <span class="stat-dot">·</span>
      <span id="stat-done" class="stat">0 completadas</span>
    </div>
  </div>

  <!-- Kanban board -->
  <main class="board" id="board">
    <!-- Columna Pendiente -->
    <section class="column" id="col-pendiente" data-estado="pendiente">
      <div class="col-header">
        <div class="col-badge badge-pendiente"></div>
        <h2 class="col-title">Pendiente</h2>
        <span class="col-count" id="count-pendiente">0</span>
        <button class="btn-col-add" data-col="pendiente" title="Añadir tarea a Pendiente">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="col-body" id="list-pendiente" 
           ondragover="handleDragOver(event)" 
           ondrop="handleDrop(event, 'pendiente')"
           ondragleave="handleDragLeave(event)">
        <div class="col-empty" id="empty-pendiente">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="12" y2="13"/>
          </svg>
          <p>Sin tareas pendientes</p>
        </div>
      </div>
    </section>

    <!-- Columna En Progreso -->
    <section class="column" id="col-progreso" data-estado="progreso">
      <div class="col-header">
        <div class="col-badge badge-progreso"></div>
        <h2 class="col-title">En progreso</h2>
        <span class="col-count" id="count-progreso">0</span>
        <button class="btn-col-add" data-col="progreso" title="Añadir tarea a En Progreso">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="col-body" id="list-progreso"
           ondragover="handleDragOver(event)"
           ondrop="handleDrop(event, 'progreso')"
           ondragleave="handleDragLeave(event)">
        <div class="col-empty" id="empty-progreso">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 3"/>
          </svg>
          <p>Arrastra tareas aquí</p>
        </div>
      </div>
    </section>

    <!-- Columna Completado -->
    <section class="column" id="col-hecho" data-estado="hecho">
      <div class="col-header">
        <div class="col-badge badge-hecho"></div>
        <h2 class="col-title">Completado</h2>
        <span class="col-count" id="count-hecho">0</span>
        <button class="btn-col-add" data-col="hecho" title="Añadir tarea a Completado">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <div class="col-body" id="list-hecho"
           ondragover="handleDragOver(event)"
           ondrop="handleDrop(event, 'hecho')"
           ondragleave="handleDragLeave(event)">
        <div class="col-empty" id="empty-hecho">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
          <p>Ninguna completada aún</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal Nueva Tarea -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal-task">
      <div class="modal-header">
        <h3 id="modal-title">Nueva tarea</h3>
        <button type="button" id="modal-close" class="modal-close-btn" title="Cerrar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-task-id" value="" />
        <div class="field-group">
          <label for="field-titulo">Título de la tarea</label>
          <input id="field-titulo" type="text" placeholder="Ej: Terminar informe de bases de datos..." autocomplete="off" />
        </div>
        <div class="field-group">
          <label for="field-descripcion">Descripción / Detalles <span style="opacity:0.6;font-size:10px;text-transform:none;">(opcional)</span></label>
          <textarea id="field-descripcion" rows="4" placeholder="Ej: En la hora de descanso a las 11:00 am, traer apuntes..."></textarea>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label for="field-curso">Categoría / Curso</label>
            <input id="field-curso" type="text" placeholder="Ej: Universidad, Trabajo, Personal..." autocomplete="off" list="cursos-list" />
            <datalist id="cursos-list">
              <option value="Universidad"></option>
              <option value="Trabajo"></option>
              <option value="Personal"></option>
              <option value="Otro"></option>
            </datalist>
          </div>
          <div class="field-group">
            <label for="field-prioridad">Prioridad</label>
            <select id="field-prioridad">
              <option value="normal">Normal</option>
              <option value="media">Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label for="field-fecha">Fecha de entrega</label>
            <input id="field-fecha" type="date" />
            <div class="quick-dates">
              <button type="button" class="btn-quick-date" data-days="0">Hoy</button>
              <button type="button" class="btn-quick-date" data-days="1">Mañana</button>
              <button type="button" class="btn-quick-date" data-days="7">+7d</button>
              <button type="button" class="btn-quick-date" data-days="clear">✕</button>
            </div>
          </div>
          <div class="field-group">
            <label for="field-hora">Hora de entrega</label>
            <input id="field-hora" type="time" title="Hora de entrega (opcional)" />
            <div class="quick-dates">
              <button type="button" class="btn-quick-time" data-time="09:00">9 am</button>
              <button type="button" class="btn-quick-time" data-time="11:00">11 am</button>
              <button type="button" class="btn-quick-time" data-time="15:00">3 pm</button>
              <button type="button" class="btn-quick-time" data-time="clear">✕</button>
            </div>
          </div>
        </div>
        <div class="field-group">
          <label for="field-estado">Estado de la tarea</label>
          <select id="field-estado">
            <option value="pendiente">Pendiente</option>
            <option value="progreso">En progreso</option>
            <option value="hecho">Completado</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="modal-cancel" class="btn-secondary">Cancelar</button>
        <button id="modal-save" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          Guardar
        </button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <script src="board.js"></script>
</body>
</html>
